name: Check AI documentation

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "docs/public/**"
      - "docs/scripts/check-ai-docs.mjs"
      - ".github/workflows/ai-docs.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "docs/public/**"
      - "docs/scripts/check-ai-docs.mjs"
      - ".github/workflows/ai-docs.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node docs/scripts/check-ai-docs.mjs
